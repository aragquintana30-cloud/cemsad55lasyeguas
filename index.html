    <!-- ==========================================================================
       SCRIPT JAVASCRIPT: Detecta el scroll y activa la animación de tus imágenes
       ========================================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Configuración del sensor de pantalla
            const opciones = {
                root: null, // Usa la pantalla del navegador
                rootMargin: "0px", 
                threshold: 0.15 // La imagen aparece suavemente cuando se asoma un 15% en pantalla
            };

            const verificarEntrada = (entradas, observador) => {
                entradas.forEach((entrada) => {
                    // Si el usuario bajó el scroll y llegó a la imagen
                    if (entrada.isIntersecting) {
                        entrada.target.classList.add("visible"); // Agrega la clase que la vuelve visible
                        observador.unobserve(entrada.target); // Deja de vigilarla para mantener el rendimiento
                    }
                });
            };

            // Activa el observador nativo
            const observador = new IntersectionObserver(verificarEntrada, opciones);

            // Selecciona de forma automática todas las imágenes del Cemsad que tengan la clase efecto-scroll
            const imagenesParaAnimar = document.querySelectorAll(".efecto-scroll");
            imagenesParaAnimar.forEach((imagen) => observador.observe(imagen));
        });
    </script>
